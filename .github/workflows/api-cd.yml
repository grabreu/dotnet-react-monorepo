name: API CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/api-*.yml'
              - '.github/workflows/_api-*.yml'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            apps/api/**/*.csproj
            apps/api/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --no-restore --verify-no-changes --severity info

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            apps/api/**/*.csproj
            apps/api/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test tests/Monorepo.UnitTests --no-build -c Release --coverage --coverage-output-format cobertura --results-directory coverage/unit

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: apps/api/coverage/unit

  integration-tests:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            apps/api/**/*.csproj
            apps/api/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test tests/Monorepo.IntegrationTests --no-build -c Release --coverage --coverage-output-format cobertura --results-directory coverage/integration

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-integration
          path: apps/api/coverage/integration

  sonarcloud:
    name: SonarCloud
    needs: [changes, format, unit-tests, integration-tests]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download unit test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-unit
          path: apps/api/coverage/unit

      - name: Download integration test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-integration
          path: apps/api/coverage/integration

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            apps/api/**/*.csproj
            apps/api/Directory.Packages.props

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"grabreu_dotnet-react-monorepo_api" \
            /o:"grabreu" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.cobertura.reportsPaths="coverage/**/*.xml"

          dotnet build -c Release

          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"

  publish:
    name: Publish
    needs: [changes, sonarcloud]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/monorepo-api

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/api
          file: apps/api/src/Monorepo.Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Resolve immutable image reference
        id: image
        run: echo "ref=${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "- Tag: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable ref: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [changes, publish]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login
        uses: azure/login@d54469830ea7d513b7371e02a077c3ee5cb7b112 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/cli@bd09fd31a7fc217371c078f503fb6e264472c289 # v3
        with:
          inlineScript: |
            az containerapp update \
              --name ca-monorepo-api-prod-brs \
              --resource-group rg-shared-prod-brs \
              --image ${{ needs.publish.outputs.image_ref }}
